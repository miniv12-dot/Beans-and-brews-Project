{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Beans & Brews</title>
    
    <link rel="stylesheet" href="{% static 'menu/style.css' %}">
    
    <style>
        :root {
            --bg-color: #FAFAFA;
            --text-main: #2C1E16;
            --text-muted: #777;
            --card-bg: white;
            --border-color: #ddd;
            --accent-orange: #E07A5F;
        }

        [data-theme="dark"] {
            --bg-color: #1a1614; 
            --text-main: #F5EBE1; 
            --text-muted: #aaa;
            --card-bg: #241812; 
            --border-color: #4A3022;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .focused-card {
            background-color: var(--card-bg) !important;
            transition: background-color 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="focused-card" style="max-width: 600px; margin: 40px auto; padding: 30px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.05);">
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid var(--border-color); padding-bottom: 20px;">
                <h1 style="color: var(--text-main); font-size: 1.6rem; font-weight: 800; margin: 0;">Secure Checkout</h1>
                {% if not user.is_authenticated %}
                <div style="background-color: rgba(224, 122, 95, 0.1); color: var(--accent-orange); padding: 12px; border-radius: 12px; font-size: 0.9rem; font-weight: 500; margin-bottom: 20px; text-align: center;">
                    Checking out as a <strong>Guest</strong>. Want to track orders permanently? <a href="{% url 'register' %}" style="color: var(--text-main); font-weight: 700; text-decoration: underline;">Sign up here</a>.
                </div>
            {% endif %}
                <a href="{% url 'cart_detail' %}" style="text-decoration: none; color: var(--text-muted); font-weight: 600; font-size: 0.95rem;">&larr; Return to Cart</a>
            </div>
            
            <form method="POST" style="display: flex; flex-direction: column; gap: 20px;">
                {% csrf_token %}
                
                <div>
                    <label style="display: block; font-weight: 700; font-size: 0.9rem; color: var(--text-main); margin-bottom: 8px;">First Name</label>
                    <input type="text" name="first_name" value="{{ user.first_name }}" required
                           style="width: 100%; padding: 12px; box-sizing: border-box; border-radius: 10px; border: 1px solid var(--border-color); font-size: 1rem; background-color: var(--bg-color); color: var(--text-main);">
                </div>
                
                <div>
                    <label style="display: block; font-weight: 700; font-size: 0.9rem; color: var(--text-main); margin-bottom: 8px;">Last Name</label>
                    <input type="text" name="last_name" value="{{ user.last_name }}" required
                           style="width: 100%; padding: 12px; box-sizing: border-box; border-radius: 10px; border: 1px solid var(--border-color); font-size: 1rem; background-color: var(--bg-color); color: var(--text-main);">
                </div>
                
                <div>
                    <label style="display: block; font-weight: 700; font-size: 0.9rem; color: var(--text-main); margin-bottom: 8px;">Email Address</label>
                    <input type="email" name="email" value="{{ user.email }}" required
                           style="width: 100%; padding: 12px; box-sizing: border-box; border-radius: 10px; border: 1px solid var(--border-color); font-size: 1rem; background-color: var(--bg-color); color: var(--text-main);">
                </div>
                
                <button type="submit" style="background-color: var(--accent-orange); color: white; border: none; width: 100%; padding: 16px; border-radius: 12px; font-weight: 700; font-size: 1.1rem; cursor: pointer; margin-top: 10px; transition: 0.3s;">Place My Order</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const currentTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
        });
    </script>
</body>
</html>
