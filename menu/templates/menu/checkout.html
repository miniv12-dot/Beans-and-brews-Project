{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout - Beans & Brews</title>
    <link rel="stylesheet" href="{% static 'menu/style.css' %}">
</head>
<body>

    <div class="app-container">
        <div class="focused-card">
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #F5EFEB; padding-bottom: 15px;">
                <h1 style="color: #2B1B17; font-size: 1.6rem; font-weight: 800;">Secure Checkout</h1>
                <a href="{% url 'cart_detail' %}" style="text-decoration: none; color: #6E5D53; font-weight: 600; font-size: 0.95rem;">&larr; Return to Cart</a>
            </div>

            <form method="POST" style="display: flex; flex-direction: column; gap: 20px;">
                {% csrf_token %}
                
                <div>
                    <label style="display: block; font-weight: 700; font-size: 0.9rem; color: #55433C; margin-bottom: 8px;">First Name</label>
                    <input type="text" name="first_name" value="{{ user.first_name }}" required 
                           style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #E6DCD2; font-size: 1rem; background-color: #FDFBF7; box-sizing: border-box;">
                </div>

                <div>
                    <label style="display: block; font-weight: 700; font-size: 0.9rem; color: #55433C; margin-bottom: 8px;">Last Name</label>
                    <input type="text" name="last_name" value="{{ user.last_name }}" required 
                           style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #E6DCD2; font-size: 1rem; background-color: #FDFBF7; box-sizing: border-box;">
                </div>

                <div>
                    <label style="display: block; font-weight: 700; font-size: 0.9rem; color: #55433C; margin-bottom: 8px;">Email Address</label>
                    <input type="email" name="email" value="{{ user.email }}" required 
                           style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #E6DCD2; font-size: 1rem; background-color: #FDFBF7; box-sizing: border-box;">
                </div>

                <button type="submit" style="background-color: #E05A36; color: white; border: none; width: 100%; padding: 16px; border-radius: 12px; font-weight: 700; font-size: 1.1rem; cursor: pointer; box-shadow: 0 6px 20px rgba(224, 90, 54, 0.25); margin-top: 10px; transition: background 0.2s;">
                    Place My Order
                </button>
            </form>

        </div>
    </div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const currentTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
        });
    </script>
</body>
</html>
