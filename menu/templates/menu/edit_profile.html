<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | Beans & Brews</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #FAFAFA;
            color: #2C1E16;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .auth-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 100%;
        }
        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: #2C1E16;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
        }
        form p {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 15px;
        }
        label {
            font-weight: 500;
            font-size: 0.95rem;
            color: #4A3022;
        }
        input {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
        }
        .btn-submit {
            background-color: #E07A5F;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #c9674e;
            transform: translateY(-2px);
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #777;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover { color: #2C1E16; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>Edit Profile</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-submit">Save Changes</button>
        </form>
        <a href="{% url 'home' %}" class="back-link">&larr; Back to Menu</a>
    </div>
</body>
</html>
