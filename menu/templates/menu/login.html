<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Beans & Brews</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap');
        
        body { font-family: 'Poppins', sans-serif; background-color: #FAFAFA; color: #2C1E16; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        
        .auth-container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 400px; width: 100%; }
        h2 { font-family: 'Playfair Display', serif; font-size: 2.5rem; color: #2C1E16; margin-top: 0; margin-bottom: 20px; text-align: center; }
        
        /* Form Element Styling */
        form p { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        label { font-weight: 500; font-size: 0.95rem; color: #4A3022; }
        input { padding: 12px 15px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Poppins', sans-serif; width: 100%; box-sizing: border-box; transition: border-color 0.3s; }
        input:focus { border-color: #E07A5F; outline: none; }
        
        /* Error Feedback Styling */
        .error-message { background-color: #fdf2f0; color: #E07A5F; padding: 15px; border-radius: 8px; font-size: 0.9rem; text-align: center; margin-bottom: 20px; border: 1px solid #fadbd6; }
        .errorlist { color: #E07A5F; font-size: 0.85rem; padding: 0; list-style: none; margin: 0; }
        
        .btn-submit { background-color: #2C1E16; color: white; padding: 15px 20px; border: none; border-radius: 30px; font-weight: 600; font-size: 1rem; width: 100%; cursor: pointer; transition: all 0.3s ease; margin-top: 10px; }
        .btn-submit:hover { background-color: #E07A5F; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(224, 122, 95, 0.4); }
        
        .back-link { display: block; text-align: center; margin-top: 25px; color: #777; text-decoration: none; font-size: 0.9rem; }
        .back-link strong { color: #E07A5F; font-weight: 600; }
        .back-link:hover strong { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>Welcome Back</h2>
        
        {% if form.errors %}
            <div class="error-message">
                Invalid username or password. Please try again.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-submit">Log In</button>
        </form>
        
        <a href="{% url 'register' %}" class="back-link">New to Beans & Brews? <strong>Create an account</strong></a>
    </div>
</body>
</html>
