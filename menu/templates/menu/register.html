<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Beans & Brews</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap');
        
        body { font-family: 'Poppins', sans-serif; background-color: #FAFAFA; color: #2C1E16; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 40px 20px; }
        
        /* Made container slightly wider to accommodate the password rules */
        .auth-container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 500px; width: 100%; }
        h2 { font-family: 'Playfair Display', serif; font-size: 2.5rem; color: #2C1E16; margin-top: 0; margin-bottom: 25px; text-align: center; }
        
        /* Form Element Styling */
        form p { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        label { font-weight: 500; font-size: 0.95rem; color: #4A3022; }
        input { padding: 12px 15px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Poppins', sans-serif; width: 100%; box-sizing: border-box; transition: border-color 0.3s; }
        input:focus { border-color: #E07A5F; outline: none; }
        
        /* Formatting Django's default help text and error lists */
        .helptext { font-size: 0.8rem; color: #888; margin-top: 5px; line-height: 1.4; }
        .helptext ul { padding-left: 20px; margin-top: 5px; }
        .errorlist { color: #E07A5F; font-size: 0.9rem; font-weight: 500; padding: 10px; background-color: #fdf2f0; border-radius: 8px; list-style: none; margin: 0 0 10px 0; border: 1px solid #fadbd6; }
        
        .btn-submit { background-color: #E07A5F; color: white; padding: 15px 20px; border: none; border-radius: 30px; font-weight: 600; font-size: 1rem; width: 100%; cursor: pointer; transition: all 0.3s ease; margin-top: 15px; }
        .btn-submit:hover { background-color: #c9674e; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(224, 122, 95, 0.4); }
        
        .back-link { display: block; text-align: center; margin-top: 25px; color: #777; text-decoration: none; font-size: 0.9rem; }
        .back-link strong { color: #2C1E16; font-weight: 600; }
        .back-link:hover strong { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>Create Account</h2>
        
        <form method="post">
            {% csrf_token %}
            
            {{ form.as_p }}
            
            <button type="submit" class="btn-submit">Register Account</button>
        </form>
        
        <a href="{% url 'login' %}" class="back-link">Already have an account? <strong>Log in here</strong></a>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 1. Find every password input on the page
            const passwordInputs = document.querySelectorAll('input[type="password"]');
            
            passwordInputs.forEach(function(input) {
                // 2. Create a wrapper div so we can position the icon perfectly inside the input
                const wrapper = document.createElement('div');
                wrapper.style.position = 'relative';
                wrapper.style.display = 'block';
                wrapper.style.width = '100%';
                
                // 3. Move the input inside our new wrapper
                input.parentNode.insertBefore(wrapper, input);
                wrapper.appendChild(input);
                
                // 4. Create the clickable eye icon
                const toggleBtn = document.createElement('span');
                toggleBtn.innerHTML = '👁️'; 
                toggleBtn.style.position = 'absolute';
                toggleBtn.style.right = '12px';
                toggleBtn.style.top = '50%';
                toggleBtn.style.transform = 'translateY(-50%)';
                toggleBtn.style.cursor = 'pointer';
                toggleBtn.style.fontSize = '1.1rem';
                toggleBtn.style.userSelect = 'none'; // Stops accidental highlighting
                
                // 5. Add extra padding so long passwords don't hide behind the icon
                input.style.paddingRight = '40px';
                
                // 6. The Toggle Logic
                toggleBtn.addEventListener('click', function() {
                    if (input.type === 'password') {
                        input.type = 'text'; // Show text
                        toggleBtn.innerHTML = '🙈'; // Swap to 'hidden' icon
                    } else {
                        input.type = 'password'; // Hide text
                        toggleBtn.innerHTML = '👁️'; // Swap to 'visible' icon
                    }
                });
                
                // 7. Inject the button into the wrapper
                wrapper.appendChild(toggleBtn);
            });
        });
    </script>
</body>
</html>
