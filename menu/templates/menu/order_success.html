{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed - Beans & Brews</title>
    
    <link rel="stylesheet" href="{% static 'menu/style.css' %}">
    
    <style>
        /* THEME VARIABLES */
        :root {
            --bg-color: #FAFAFA;
            --text-main: #2C1E16;
            --text-muted: #777;
            --card-bg: white;
            --border-color: #ddd;
            --accent-orange: #E07A5F;
        }

        /* DARK MODE OVERRIDES */
        [data-theme="dark"] {
            --bg-color: #1a1614; 
            --text-main: #F5EBE1; 
            --text-muted: #aaa;
            --card-bg: #241812; 
            --border-color: #4A3022;
        }

        /* BASE ADAPTATIONS */
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .focused-card {
            background-color: var(--card-bg) !important;
            transition: background-color 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="focused-card" style="text-align: center; max-width: 500px; margin: 60px auto; padding: 40px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.05);">
            
            <div style="font-size: 3.5rem; margin-bottom: 15px;">🎉</div>
            
            <h1 style="color: var(--text-main); font-size: 1.8rem; font-weight: 800; margin-bottom: 10px;">Order Confirmed!</h1>
            
            <p style="color: var(--text-muted); line-height: 1.6; margin-bottom: 30px;">
                Thank you for fueling up with us, <strong>{{ order.first_name }}</strong>. Your coffee request has been sent directly to the barista counter.
            </p>

            <div style="display: flex; flex-direction: column; gap: 12px;">
                <a href="{% url 'my_orders' %}" style="text-decoration: none; background-color: var(--accent-orange); color: white; padding: 14px; border-radius: 12px; font-weight: 600; font-size: 1rem; transition: 0.3s;">
                    Track My Order Status
                </a>
                
                <a href="{% url 'home' %}" style="text-decoration: none; background-color: transparent; border: 1px solid var(--border-color); color: var(--text-main); padding: 14px; border-radius: 12px; font-weight: 600; font-size: 1rem; transition: 0.3s;">
                    Back to Homepage
                </a>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const currentTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
        });
    </script>
</body>
</html>
