{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error | Beans & Brews</title>
    <style>
        :root {
            --bg-color: #FAFAFA; --text-main: #2C1E16; --text-muted: #777; --card-bg: white; --accent-orange: #E07A5F;
        }
        [data-theme="dark"] {
            --bg-color: #1a1614; --text-main: #F5EBE1; --text-muted: #aaa; --card-bg: #241812;
        }
        body {
            background-color: var(--bg-color); color: var(--text-main); transition: background-color 0.3s ease, color 0.3s ease; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body>
    <div style="background: var(--card-bg); padding: 50px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); max-width: 500px; margin: 20px;">
        <div style="font-size: 4rem; margin-bottom: 10px;">🔧</div>
        <h1 style="font-size: 2.5rem; margin: 0 0 10px 0; font-weight: 800;">500</h1>
        <h2 style="font-size: 1.2rem; color: var(--accent-orange); margin: 0 0 20px 0;">Our espresso machine is jammed.</h2>
        <p style="color: var(--text-muted); line-height: 1.6; margin-bottom: 30px;">
            We are experiencing an internal server error. Our head barista (admin) has been notified. Please try again in a few minutes.
        </p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const currentTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
        });
    </script>
</body>
</html>
