{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Confirmed - Beans & Brews</title>
    <link rel="stylesheet" href="{% static 'menu/style.css' %}">
</head>
<body>

    <div class="app-container">
        <div class="focused-card" style="text-align: center; max-width: 500px;">
            
            <div style="font-size: 3.5rem; margin-bottom: 15px;">🎉</div>
            <h1 style="color: #2B1B17; font-size: 1.8rem; font-weight: 800; margin-bottom: 10px;">Order Confirmed!</h1>
            <p style="color: #6E5D53; line-height: 1.6; margin-bottom: 30px;">
                Thank you for fueling up with us, <strong>{{ order.first_name }}</strong>. Your coffee request has been sent directly to the barista counter.
            </p>

            <div style="display: flex; flex-direction: column; gap: 12px;">
                <a href="{% url 'my_orders' %}" style="text-decoration: none; background-color: #E05A36; color: white; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 1rem; box-shadow: 0 6px 16px rgba(224, 90, 54, 0.2);">
                    Track My Order Status
                </a>
                <a href="{% url 'home' %}" style="text-decoration: none; background-color: #EFECE6; color: #2B1B17; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 1rem;">
                    Back to Homepage
                </a>
            </div>

        </div>
    </div>

</body>
</html>
