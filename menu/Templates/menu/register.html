{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - Beans & Brews</title>
    <link rel="stylesheet" href="{% static 'menu/style.css' %}">
</head>
<body>

    <div class="app-container">
        <div class="focused-card" style="max-width: 480px;">
            
            <h1 style="color: #2B1B17; font-size: 1.8rem; font-weight: 800; text-align: center; margin-bottom: 30px;">Create Account</h1>
            
            <form method="POST" style="display: flex; flex-direction: column; gap: 20px;">
                {% csrf_token %}
                
                <div style="display: flex; flex-direction: column; gap: 12px;" class="django-form-inputs">
                    {{ form.as_p }}
                </div>

                <button type="submit" style="background-color: #E05A36; color: white; border: none; width: 100%; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 10px; box-shadow: 0 6px 16px rgba(224, 90, 54, 0.2);">
                    Register Account
                </button>
            </form>

            <p style="text-align: center; color: #6E5D53; font-size: 0.95rem; margin-top: 25px;">
                Already have an account? <a href="{% url 'login' %}" style="color: #2B1B17; font-weight: 700; text-decoration: none;">Log in here</a>
            </p>

        </div>
    </div>

</body>
</html>
